name: Optimize Tanzania cover (one time)
on:
  push:
    paths:
      - '.github/workflows/optimize-tanzania-cover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Compress high-resolution trip cover
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          p = Path("audio/tansania-2026/00-Cover.JPG")
          with Image.open(p) as im:
              rgb = ImageOps.exif_transpose(im).convert("RGB")
              old_size = p.stat().st_size
              rgb.thumbnail((2000, 2000), Image.Resampling.LANCZOS)
              rgb.save(p, format="JPEG", quality=86, subsampling=0, optimize=True, progressive=True)
              print(f"Cover: {rgb.width}x{rgb.height}; {old_size} -> {p.stat().st_size} bytes")
          PY
      - name: Commit optimized original
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "audio/tansania-2026/00-Cover.JPG"
          if ! git diff --cached --quiet; then
            git commit -m "Optimize Tanzania trip cover for web without losing desktop quality"
            git push
          fi
